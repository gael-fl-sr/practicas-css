<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
    <title>Styled To-Do List</title>
</head>

<body>
    <div class="card">
        <h1>Mis Tareas Pendientes</h1>
        <ul class="todo-list">
            <!--Elemento #1-->
            <li class="item">
                <input id="task-one" type="checkbox">
                <label for="task-one">Buscar teclados online</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="#" target="_blank">Amazon</a></li>
                </ul>
            </li>
            <!--Elemento #2-->
            <li class="item">
                <input id="task-two" type="checkbox">
                <label for="task-two">Terminar el reporte</label>
                <ul class="sub-item">
                <li><a class="sub-item-link" href="#" target="_blank">Google Drive</a></li>
                </ul>
            </li>
            <!--Elemento #3-->
            <li class="item">
                <input id="task-three" type="checkbox">
                <label for="task-three">Revisar la garantia de la PC</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="#" target="_blank">AppStore</a></li>
                </ul>
            </li>
            <!--Elemento #4-->
            <li class="item">
                <input id="task-four" type="checkbox">
                <label for="task-four">Revisar especificaciones del procesador</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="#"   target="_blank">Intel</a></li>
                </ul>
            </li>
        </ul>
    </div>
</body>

</html>
